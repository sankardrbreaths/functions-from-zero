
name: Python CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: make install

      - name: Lint with pylint
        run: make lint

      - name: Test with pytest
        run: make test

      - name: Check code formatting
        run: black --check *.py
